# NovaOS live medium boot menu
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
loadfont /boot/grub/themes/novaos/inter-regular-20.pf2
loadfont /boot/grub/themes/novaos/inter-regular-16.pf2
loadfont /boot/grub/themes/novaos/inter-regular-14.pf2
set gfxmode=1920x1080,1280x800,1024x768,auto
terminal_output gfxterm
set theme=/boot/grub/themes/novaos/theme.txt

menuentry "Try or install NovaOS @VERSION@" {
	set gfxpayload=keep
	linux /casper/vmlinuz boot=casper quiet splash noprompt ---
	initrd /casper/initrd
}
menuentry "NovaOS (safe graphics)" {
	linux /casper/vmlinuz boot=casper nomodeset noprompt ---
	initrd /casper/initrd
}
menuentry "NovaOS (text boot messages, for troubleshooting)" {
	linux /casper/vmlinuz boot=casper noprompt console=tty0 console=ttyS0,115200 ---
	initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" {
	fwsetup
}
fi
menuentry "Restart" { reboot }
menuentry "Power off" { halt }
