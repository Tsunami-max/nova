# Builds the NovaOS ISO on GitHub's hosted runners and publishes it as a
# GitHub Release, so it can be downloaded as a single file.
#  - arm64: native Apple-silicon build (fast in UTM "Virtualize")
#  - amd64: Intel/AMD build (UTM "Emulate" on Apple silicon, or real PCs)
# Runs automatically on every push to main, or by hand from the Actions tab.
name: Build NovaOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ (github.event.inputs.arch || 'arm64') == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      ARCH: ${{ github.event.inputs.arch || 'arm64' }}
      NOVA_FIREFOX: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: Build ISO
        run: sudo -E ./build.sh

      - name: Check result
        run: |
          ls -lh out/
          sudo apt-get install -y xorriso >/dev/null
          xorriso -indev out/*.iso -report_el_torito plain 2>/dev/null | grep -i "boot img"
          grep -c . out/packages.manifest
          grep -E "^(firefox|chromium|epiphany-browser|gstreamer1.0-libav) " out/packages.manifest || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.ARCH }}-${{ github.run_number }}
          name: NovaOS ${{ env.ARCH }} (build ${{ github.run_number }})
          body: |
            NovaOS live/installer ISO for **${{ env.ARCH }}**.
            Download the `.iso` file below and open it in UTM
            (${{ env.ARCH == 'arm64' && 'Virtualize → Linux' || 'Emulate → Linux → x86_64' }}).
          files: |
            out/*.iso
            out/*.sha256
