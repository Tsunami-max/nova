# NovaOS installer (Calamares) configuration
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/aarch64-linux-gnu/calamares/modules ]

instances:
- id:       removelive
  module:   shellprocess
  config:   shellprocess-removelive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@removelive
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: novaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
