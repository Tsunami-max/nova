---
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - users
    - audio
    - video
    - name: sudo
      must_exist: true
      system: true
autologinGroup: autologin
doAutologin: true
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root, nova ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "novaos-${cpu}"
