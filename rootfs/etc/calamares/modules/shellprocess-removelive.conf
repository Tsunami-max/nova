---
# Remove live-session-only packages and files from the installed system.
dontChroot: false
timeout: 600
script:
    - command: "apt-get -y --purge remove casper calamares"
      timeout: 600
    - "-apt-get -y --purge autoremove"
    - "rm -f /etc/polkit-1/rules.d/49-novaos-live.rules /etc/casper.conf"
    - "rm -f /etc/sudoers.d/casper /etc/sddm.conf.d/50-novaos-live.conf"
    # The live image ships without an initramfs (it is on the ISO instead): create one.
    - command: "sh -c 'ls /boot/initrd.img-* >/dev/null 2>&1 || update-initramfs -c -k all'"
      timeout: 900
