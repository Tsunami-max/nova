[greeter]
background=/usr/share/backgrounds/novaos/nova-login.jpg
theme-name=NovaOS-Dark
icon-theme-name=NovaOS-Dark
cursor-theme-name=Adwaita
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/novaos/logo/novaos-logo-128.png
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%a %d %b  %H:%M
position=50%,center 50%,center
