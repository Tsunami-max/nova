# NovaOS visual effects: "Full" (blur + rounded corners; best with GPU acceleration)
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.07;
fade-delta = 6;
fade-exclude = [ "window_type = 'desktop'" ];

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'normal' && !_NET_WM_WINDOW_OPACITY",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c"
];

detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; focus = true; };
  dock = { shadow = false; };
  popup_menu = { shadow = true; };
  dropdown_menu = { shadow = true; };
};
