# NovaOS visual effects: "Balanced" (CPU-friendly, works without a GPU)
backend = "xrender";
vsync = false;
use-damage = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.42;
shadow-offset-x = -16;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Xfce4-screenshooter'"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.08;
fade-delta = 8;
fade-exclude = [ "window_type = 'desktop'" ];

inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; focus = true; };
  dock = { shadow = false; };
  popup_menu = { shadow = true; opacity = 1.0; };
  dropdown_menu = { shadow = true; opacity = 1.0; };
  notification = { shadow = true; };
};
